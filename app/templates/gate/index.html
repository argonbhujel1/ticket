<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" href="/static/images/favicon.png" type="image/png">
  <title>PGC Gate Scanner</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body{margin:0;font-family:system-ui,sans-serif;background:#070b14;color:#f0f2f5;
      min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
    h1{color:#c9a227;font-size:1.15rem;letter-spacing:0.08em;margin:0}
    .stats{display:flex;gap:12px;margin:16px 0;flex-wrap:wrap;justify-content:center}
    .stats div{background:#0d1526;border:1px solid rgba(201,162,39,0.3);border-radius:12px;
      padding:12px 16px;text-align:center;min-width:90px}
    .stats strong{display:block;font-size:1.45rem;color:#ffd56a}
    .stats .rej strong{color:#e57373}
    .stats .ok strong{color:#81c784}
    .stats span{font-size:0.72rem;color:#888}
    #reader{width:min(360px,92vw);border-radius:14px;overflow:hidden;
      border:2px solid #c9a227;background:#111;min-height:220px}
    .manual{margin-top:16px;width:min(360px,92vw);text-align:center}
    input{width:100%;padding:12px;border-radius:10px;border:1px solid #333;
      background:#0d1526;color:#fff;font-size:1rem;text-align:center;box-sizing:border-box}
    button{margin-top:10px;padding:12px 24px;border:none;border-radius:999px;background:#c9a227;
      color:#111;font-weight:800;cursor:pointer;font-size:0.95rem}
    button.secondary{background:transparent;border:1px solid #c9a227;color:#c9a227}
    #result{margin-top:16px;padding:18px;border-radius:14px;min-width:260px;text-align:center;display:none}
    #result.ok{background:rgba(46,125,50,0.25);border:2px solid #2e7d32;display:block}
    #result.bad{background:rgba(229,57,53,0.2);border:2px solid #e53935;display:block}
    #result.used{background:rgba(255,167,38,0.2);border:2px solid #ffa726;display:block}
    a{color:#c9a227;font-size:0.85rem}
    .hint{color:#666;font-size:0.8rem;margin-top:8px}
  </style>
</head>
<body>
  <h1>PGC GATE SCANNER</h1>
  <p style="color:#888;font-size:0.85rem;margin:6px 0 0">
    {{ current_user.username }} · <a href="{{ url_for('gate.logout') }}">Logout</a>
  </p>

  <div class="stats">
    <div class="ok"><strong id="entered">{{ entered }}</strong><span>Total Entered</span></div>
    <div class="rej"><strong id="rejected">{{ rejected }}</strong><span>Total Rejected</span></div>
    <div><strong>{{ valid_left }}</strong><span>Valid left</span></div>
    <div><strong>{{ used }}</strong><span>Used</span></div>
  </div>

  <div id="reader"></div>
  <p class="hint">Point camera at ticket QR · or type code below</p>

  <div class="manual">
    <input id="code" placeholder="Ticket code e.g. PGC-TKT-2026-000001" autocomplete="off">
    <button type="button" onclick="scanManual()">CHECK CODE</button>
    <button type="button" class="secondary" id="btnCam" onclick="toggleCam()">Stop camera</button>
  </div>

  <div id="result"></div>

  <script>
  const CHECK_URL = {{ url_for('gate.check')|tojson }};
  let lastCode = '';
  let lastAt = 0;
  let camOn = true;
  let html5QrCode = null;

  async function processCode(raw) {
    let code = (raw || '').trim().toUpperCase();
    if (code.includes('/')) {
      const parts = code.split('/').filter(Boolean);
      code = parts[parts.length - 1].toUpperCase();
    }
    if (!code) return;
    const now = Date.now();
    if (code === lastCode && now - lastAt < 2500) return;
    lastCode = code;
    lastAt = now;

    try {
      const r = await fetch(CHECK_URL, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({code})
      });
      const d = await r.json();
      if (d.entered != null) document.getElementById('entered').textContent = d.entered;
      if (d.rejected != null) document.getElementById('rejected').textContent = d.rejected;
      const el = document.getElementById('result');
      el.className = d.ok ? 'ok' : (d.status === 'used' ? 'used' : 'bad');
      el.style.display = 'block';
      el.innerHTML = `<div style="font-size:1.35rem;font-weight:900">${d.message || d.status}</div>
        <div style="margin-top:8px">${d.code || ''}</div>
        <div>${d.holder || ''}</div>
        <div style="color:#aaa;font-size:0.9rem">${d.match || ''} · ${d.class || ''}</div>`;
      if (navigator.vibrate) navigator.vibrate(d.ok ? [40] : [80, 40, 80]);
      setTimeout(() => { el.style.display = 'none'; el.className = ''; }, 4000);
    } catch (e) {
      alert('Network error: ' + e);
    }
  }

  function scanManual() {
    processCode(document.getElementById('code').value);
    document.getElementById('code').value = '';
    document.getElementById('code').focus();
  }

  document.getElementById('code').addEventListener('keydown', e => {
    if (e.key === 'Enter') scanManual();
  });

  function onScanSuccess(decodedText) {
    processCode(decodedText);
  }

  async function startCam() {
    if (!html5QrCode) {
      html5QrCode = new Html5Qrcode('reader');
    }
    try {
      await html5QrCode.start(
        { facingMode: 'environment' },
        { fps: 8, qrbox: { width: 220, height: 220 } },
        onScanSuccess,
        () => {}
      );
      camOn = true;
      document.getElementById('btnCam').textContent = 'Stop camera';
    } catch (err) {
      document.getElementById('reader').innerHTML =
        '<p style="padding:24px;color:#888;text-align:center">Camera not available.<br>Use manual code entry.</p>';
      document.getElementById('btnCam').style.display = 'none';
    }
  }

  async function toggleCam() {
    if (!html5QrCode) return;
    if (camOn) {
      try { await html5QrCode.stop(); } catch (e) {}
      camOn = false;
      document.getElementById('btnCam').textContent = 'Start camera';
    } else {
      await startCam();
    }
  }

  startCam();
  </script>
</body>
</html>
